<div class="container-fluid pssms-page pssms-dept-academic" id="teacherClubsPage">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h4 class="fw-bold mb-1"><i class="fas fa-users me-2" style="color:var(--p-accent);"></i>ชุมนุมที่ดูแล</h4>
      <p class="text-muted small mb-0">เทอม <span id="tcTerm">-</span>/<span id="tcYear">-</span></p>
    </div>
    <button class="btn btn-outline-secondary btn-sm" onclick="initTeacherClubs()"><i class="fas fa-sync me-1"></i>รีเฟรช</button>
  </div>

  <!-- Club selector (ถ้ามีหลายชุมนุม) -->
  <div id="tcClubSelector" class="d-none mb-3"></div>

  <!-- Loading state -->
  <div id="tcLoadingState" class="text-center text-muted p-5">
    <div class="spinner-border spinner-border-sm me-2"></div>กำลังโหลด...
  </div>

  <!-- Empty state -->
  <div id="tcEmptyState" class="d-none text-center text-muted p-5">
    <i class="fas fa-inbox fa-3x opacity-25 mb-3 d-block"></i>
    ยังไม่ได้รับมอบหมายให้ดูแลชุมนุมในเทอมนี้
  </div>

  <!-- Error state -->
  <div id="tcErrorState" class="d-none text-center text-danger p-5">
    <i class="fas fa-exclamation-triangle fa-2x mb-3 d-block"></i>
    <span id="tcErrorMsg">โหลดข้อมูลไม่สำเร็จ</span>
  </div>

  <!-- Main content -->
  <div id="tcMainContent" class="d-none">
    <!-- Club Hero Card -->
    <div class="pssms-card mb-3 p-3">
      <div class="d-flex align-items-start gap-3">
        <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
             style="width:52px;height:52px;background:var(--p-accent-soft);border:1px solid var(--p-border);">
          <i class="fas fa-users" style="color:var(--p-accent);font-size:20px;"></i>
        </div>
        <div class="flex-grow-1">
          <h5 class="fw-bold mb-1" id="tcHeroName">-</h5>
          <p class="text-muted small mb-2" id="tcHeroDesc"></p>
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <span class="badge bg-primary" id="tcHeroRole">-</span>
            <span class="text-muted small" id="tcHeroAdvisors"></span>
          </div>
        </div>
        <div class="text-end flex-shrink-0">
          <div class="fw-bold fs-5" id="tcHeroCount">-</div>
          <div class="text-muted small" id="tcHeroCapacity"></div>
          <div class="progress mt-1" style="width:80px;height:6px;">
            <div class="progress-bar" id="tcHeroBar" style="width:0%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-3" id="tcTabs">
      <li class="nav-item">
        <button class="nav-link active" onclick="tcShowTab('members',this)">
          <i class="fas fa-list me-1"></i>สมาชิก <span class="badge bg-secondary ms-1" id="tcMemberTabCount">0</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="tcShowTab('attendance',this)">
          <i class="fas fa-calendar-check me-1"></i>เช็คชื่อ
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="tcShowTab('stats',this)">
          <i class="fas fa-chart-bar me-1"></i>สถิติ
        </button>
      </li>
    </ul>

    <!-- Tab: สมาชิก -->
    <div id="tcTabMembers">
      <div class="d-flex gap-2 mb-3">
        <input type="text" class="form-control form-control-sm" id="tcMemberSearch"
               placeholder="ค้นหาชื่อ / รหัส..." oninput="tcFilterMembers(this.value)">
        <button class="btn btn-outline-primary btn-sm flex-shrink-0" onclick="tcPrintMembers()">
          <i class="fas fa-print me-1"></i>พิมพ์
        </button>
      </div>
      <div id="tcMembersBody"></div>
    </div>

    <!-- Tab: เช็คชื่อ -->
    <div id="tcTabAttendance" class="d-none">
      <div class="d-flex align-items-center gap-2 mb-3">
        <input type="date" class="form-control form-control-sm" id="tcAttDate" style="max-width:180px;"
               onchange="tcShowAttendanceForDate(this.value)">
        <span class="text-muted small" id="tcAttSessionCount"></span>
        <button class="btn btn-accent btn-sm ms-auto" onclick="tcGoToAttendance()">
          <i class="fas fa-external-link-alt me-1"></i>ไปที่เช็คชื่อ
        </button>
      </div>
      <div id="tcAttBody">
        <div class="text-center text-muted py-4"><i class="fas fa-calendar-alt fa-2x opacity-25 mb-2 d-block"></i>เลือกวันที่เพื่อดูข้อมูล</div>
      </div>
    </div>

    <!-- Tab: สถิติ -->
    <div id="tcTabStats" class="d-none">
      <div id="tcStatsBody">
        <div class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm me-2"></div>กำลังโหลดสถิติ...</div>
      </div>
    </div>
  </div>
</div>

<script>
let _tcMyClubs = [];
let _tcCurrentClub = null;
let _tcMembers = [];
let _tcAttSummary = null;

// ==========================================
// Init
// ==========================================
function initTeacherClubs() {
  const user = JSON.parse(localStorage.getItem('pssms_user') || sessionStorage.getItem('pssms_user'));
  if (!user) {
    _tcShowState('error', 'กรุณาเข้าสู่ระบบใหม่');
    return;
  }
  document.getElementById('tcTerm').textContent = user.currentTerm;
  document.getElementById('tcYear').textContent = user.currentYear;
  _tcShowState('loading');

  google.script.run
    .withSuccessHandler(list => {
      _tcMyClubs = list || [];
      if (!_tcMyClubs.length) { _tcShowState('empty'); return; }
      if (_tcMyClubs.length === 1) {
        _tcSelectClub(_tcMyClubs[0]);
      } else {
        _tcRenderSelector(_tcMyClubs);
        _tcSelectClub(_tcMyClubs[0]);
      }
    })
    .withFailureHandler(err => _tcShowState('error', err.message || 'โหลดข้อมูลไม่สำเร็จ'))
    .getMyClubs(user.id, user.currentTerm, user.currentYear);
}

function _tcShowState(state, msg) {
  ['tcLoadingState','tcEmptyState','tcErrorState','tcMainContent'].forEach(id => {
    document.getElementById(id).classList.add('d-none');
  });
  if (state === 'loading') document.getElementById('tcLoadingState').classList.remove('d-none');
  else if (state === 'empty') document.getElementById('tcEmptyState').classList.remove('d-none');
  else if (state === 'error') {
    document.getElementById('tcErrorMsg').textContent = msg || 'เกิดข้อผิดพลาด';
    document.getElementById('tcErrorState').classList.remove('d-none');
  } else if (state === 'main') document.getElementById('tcMainContent').classList.remove('d-none');
}

function _tcRenderSelector(clubs) {
  const sel = document.getElementById('tcClubSelector');
  sel.innerHTML = clubs.map((c, i) =>
    `<button class="btn btn-sm me-2 mb-1 ${i===0?'btn-accent':'btn-outline-secondary'}"
             onclick="_tcSelectClub(window._tcMyClubs[${i}], this)">${_tcEsc(c.clubName)}</button>`
  ).join('');
  sel.classList.remove('d-none');
}

function _tcSelectClub(club, btn) {
  if (btn) {
    document.querySelectorAll('#tcClubSelector button').forEach(b => {
      b.classList.replace('btn-accent','btn-outline-secondary');
    });
    btn.classList.replace('btn-outline-secondary','btn-accent');
  }
  _tcCurrentClub = club;
  _tcAttSummary = null;
  _tcRenderHero(club);
  _tcShowState('main');
  tcShowTab('members', document.querySelector('#tcTabs .nav-link.active'));
  _tcLoadMembers();
}

// ==========================================
// Hero Card
// ==========================================
function _tcRenderHero(c) {
  const advText = (c.advisors||[]).map(a=>a.teacherName).filter(Boolean).join(', ');
  const pct = c.capacity > 0 ? Math.min(100, Math.round(c.memberCount/c.capacity*100)) : 0;
  const barClass = c.full ? 'bg-danger' : pct > 80 ? 'bg-warning' : 'bg-success';
  document.getElementById('tcHeroName').textContent = c.clubName;
  document.getElementById('tcHeroDesc').textContent = c.description || '';
  document.getElementById('tcHeroRole').textContent = c.myRole || 'ที่ปรึกษา';
  document.getElementById('tcHeroAdvisors').textContent = advText ? 'ที่ปรึกษา: ' + advText : '';
  document.getElementById('tcHeroCount').textContent = c.memberCount + ' คน';
  document.getElementById('tcHeroCapacity').textContent = c.capacity ? `/ ${c.capacity} คน` : '';
  const bar = document.getElementById('tcHeroBar');
  bar.style.width = pct + '%';
  bar.className = 'progress-bar ' + barClass;
}

// ==========================================
// Tab: สมาชิก
// ==========================================
function _tcLoadMembers() {
  const user = JSON.parse(localStorage.getItem('pssms_user') || sessionStorage.getItem('pssms_user'));
  if (!user || !_tcCurrentClub) return;
  document.getElementById('tcMembersBody').innerHTML =
    '<div class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm me-2"></div>กำลังโหลดสมาชิก...</div>';

  google.script.run
    .withSuccessHandler(res => {
      if (res && res.error) {
        document.getElementById('tcMembersBody').innerHTML = `<div class="text-danger text-center py-3">❌ ${res.error}</div>`;
        return;
      }
      _tcMembers = Array.isArray(res) ? res : [];
      document.getElementById('tcMemberTabCount').textContent = _tcMembers.length;
      tcFilterMembers('');
    })
    .withFailureHandler(err => {
      document.getElementById('tcMembersBody').innerHTML =
        `<div class="text-danger text-center py-3">❌ ${err.message||'โหลดไม่สำเร็จ'}</div>`;
    })
    .getClubMembersForTeacher(user.id, _tcCurrentClub.clubId, user.currentTerm, user.currentYear, user.role);
}

function tcFilterMembers(q) {
  const query = q.toLowerCase();
  const filtered = query
    ? _tcMembers.filter(m => m.studentName.toLowerCase().includes(query) || m.studentId.includes(query) || m.className.includes(query))
    : _tcMembers;

  if (!filtered.length) {
    document.getElementById('tcMembersBody').innerHTML =
      '<div class="text-muted text-center py-4"><i class="fas fa-inbox fa-2x opacity-25 mb-2 d-block"></i>' + (query ? 'ไม่พบที่ค้นหา' : 'ยังไม่มีสมาชิก') + '</div>';
    return;
  }

  const byClass = {};
  filtered.forEach(m => (byClass[m.className] = byClass[m.className] || []).push(m));
  let html = '';
  Object.keys(byClass).sort().forEach(cls => {
    const rows = byClass[cls];
    html += `<div class="pssms-card mb-2">
      <div class="pssms-card-header d-flex justify-content-between align-items-center px-3 py-2">
        <span class="fw-bold small">ห้อง ${_tcEsc(cls)}</span>
        <span class="badge bg-secondary">${rows.length} คน</span>
      </div>
      <table class="pssms-table table mb-0"><thead><tr>
        <th style="width:40px" class="text-center">ที่</th>
        <th style="width:110px">รหัส</th>
        <th>ชื่อ-สกุล</th>
        <th style="width:110px" class="text-muted small">ลงทะเบียน</th>
      </tr></thead><tbody>`;
    rows.forEach((m, i) => {
      const dateStr = m.registeredAt ? m.registeredAt.split(' ')[0] : '-';
      html += `<tr>
        <td class="text-center text-muted">${i+1}</td>
        <td class="font-monospace small">${_tcEsc(m.studentId)}</td>
        <td>${_tcEsc(m.studentName)}</td>
        <td class="text-muted small">${dateStr}</td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  });
  document.getElementById('tcMembersBody').innerHTML = html;
}

// ==========================================
// Tab: เช็คชื่อ
// ==========================================
function _tcLoadAttSummary(cb) {
  if (_tcAttSummary) { cb(_tcAttSummary); return; }
  const user = JSON.parse(localStorage.getItem('pssms_user') || sessionStorage.getItem('pssms_user'));
  if (!user || !_tcCurrentClub) return;
  google.script.run
    .withSuccessHandler(res => {
      _tcAttSummary = res;
      cb(res);
    })
    .withFailureHandler(() => { _tcAttSummary = { sessions: [], members: [] }; cb(_tcAttSummary); })
    .getClubAttendanceSummary(user.id, _tcCurrentClub.clubId, user.currentTerm, user.currentYear, user.role);
}

function tcShowAttendanceForDate(date) {
  if (!date) return;
  document.getElementById('tcAttBody').innerHTML =
    '<div class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm me-2"></div>กำลังโหลด...</div>';

  _tcLoadAttSummary(function(summary) {
    if (summary.error) {
      document.getElementById('tcAttBody').innerHTML = `<div class="text-danger text-center py-3">❌ ${summary.error}</div>`;
      return;
    }
    const sessions = summary.sessions || [];
    document.getElementById('tcAttSessionCount').textContent = sessions.length ? `${sessions.length} คาบที่เช็คแล้วในเทอมนี้` : 'ยังไม่มีประวัติการเช็คชื่อ';

    // หา records ของวันที่เลือก
    const dayMembers = summary.members || [];
    // เราไม่มี per-date breakdown จาก summary — แสดงสถานะรวม
    // ถ้า date ไม่อยู่ใน sessions → ยังไม่ได้เช็คชื่อวันนี้
    if (!sessions.includes(date)) {
      document.getElementById('tcAttBody').innerHTML = `
        <div class="text-center text-muted py-4">
          <i class="fas fa-calendar-times fa-2x opacity-25 mb-2 d-block"></i>
          วันที่ ${date} ยังไม่มีการเช็คชื่อ<br>
          <small>กด "ไปที่เช็คชื่อ" เพื่อเช็คชื่อคาบชุมนุม</small>
        </div>`;
      return;
    }

    // แสดงสถิติรวม (per-session detail ต้องมี getAttendanceByDate ซึ่งยังไม่ implement)
    const total = dayMembers.length;
    const present = dayMembers.filter(m => m.present > 0).length;
    document.getElementById('tcAttBody').innerHTML = `
      <div class="alert alert-info small mb-3">
        <i class="fas fa-info-circle me-1"></i>วันที่ ${date} มีการเช็คชื่อแล้ว
        (สถิติรายวันแบบละเอียดดูได้ที่หน้าเช็คชื่อ)
      </div>
      <div class="row g-2 text-center">
        <div class="col-4"><div class="pssms-card p-3"><div class="fw-bold fs-4 text-primary">${total}</div><div class="small text-muted">สมาชิก</div></div></div>
        <div class="col-4"><div class="pssms-card p-3"><div class="fw-bold fs-4 text-success">${sessions.length}</div><div class="small text-muted">คาบที่เช็คแล้ว</div></div></div>
        <div class="col-4"><div class="pssms-card p-3"><div class="fw-bold fs-4 text-warning">${sessions.filter(s=>s>=date.slice(0,7)).length}</div><div class="small text-muted">คาบเดือนนี้</div></div></div>
      </div>`;
  });
}

function tcGoToAttendance() {
  if (!_tcCurrentClub) return;
  const user = JSON.parse(localStorage.getItem('pssms_user') || sessionStorage.getItem('pssms_user'));
  if (!user) return;
  sessionStorage.setItem('pending_attendance_item', JSON.stringify({
    subjectCode: 'CLUB_' + _tcCurrentClub.clubId,
    subjectName: _tcCurrentClub.clubName,
    className: '',
    period: '',
    term: user.currentTerm,
    year: user.currentYear
  }));
  loadPage('Page_Academic');
}

// ==========================================
// Tab: สถิติ
// ==========================================
function _tcRenderStats() {
  document.getElementById('tcStatsBody').innerHTML =
    '<div class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm me-2"></div>กำลังโหลด...</div>';

  _tcLoadAttSummary(function(summary) {
    if (summary.error) {
      document.getElementById('tcStatsBody').innerHTML = `<div class="text-danger text-center py-3">❌ ${summary.error}</div>`;
      return;
    }
    const members = summary.members || [];
    const totalSessions = summary.sessions ? summary.sessions.length : 0;

    if (!totalSessions) {
      document.getElementById('tcStatsBody').innerHTML =
        '<div class="text-center text-muted py-4"><i class="fas fa-chart-bar fa-2x opacity-25 mb-2 d-block"></i>ยังไม่มีข้อมูลการเช็คชื่อ</div>';
      return;
    }

    const avgPct = members.length
      ? Math.round(members.reduce((s,m) => s + (m.pct||0), 0) / members.length)
      : 0;

    let html = `<div class="row g-2 mb-3 text-center">
      <div class="col-4"><div class="pssms-card p-3"><div class="fw-bold fs-4 text-primary">${totalSessions}</div><div class="small text-muted">คาบที่เช็คแล้ว</div></div></div>
      <div class="col-4"><div class="pssms-card p-3"><div class="fw-bold fs-4 text-success">${avgPct}%</div><div class="small text-muted">เฉลี่ยเข้าร่วม</div></div></div>
      <div class="col-4"><div class="pssms-card p-3"><div class="fw-bold fs-4 text-danger">${members.filter(m=>(m.pct||0)<80).length}</div><div class="small text-muted">ต่ำกว่า 80%</div></div></div>
    </div>`;

    // Sort by pct ascending (ต่ำสุดขึ้นก่อน)
    const sorted = [...members].sort((a,b) => (a.pct||0) - (b.pct||0));
    html += '<div class="pssms-card"><div class="pssms-card-header px-3 py-2 fw-bold small">สถิติรายคน</div>';
    html += '<div class="p-2">';
    sorted.forEach(m => {
      const pct = m.pct !== null ? m.pct : 0;
      const barColor = pct < 60 ? 'bg-danger' : pct < 80 ? 'bg-warning' : 'bg-success';
      const textColor = pct < 60 ? 'text-danger' : pct < 80 ? 'text-warning' : 'text-success';
      html += `<div class="d-flex align-items-center gap-2 mb-2">
        <div style="width:130px;font-size:12px;" class="text-truncate">${_tcEsc(m.studentName)}</div>
        <div class="text-muted" style="width:55px;font-size:11px;">${_tcEsc(m.className)}</div>
        <div class="flex-grow-1"><div class="progress" style="height:8px;">
          <div class="progress-bar ${barColor}" style="width:${pct}%;"></div>
        </div></div>
        <div class="fw-bold ${textColor}" style="width:40px;text-align:right;font-size:13px;">${m.pct!==null?pct+'%':'-'}</div>
      </div>`;
    });
    html += '</div></div>';
    document.getElementById('tcStatsBody').innerHTML = html;
  });
}

// ==========================================
// Tab switching
// ==========================================
function tcShowTab(tab, btn) {
  ['tcTabMembers','tcTabAttendance','tcTabStats'].forEach(id => document.getElementById(id).classList.add('d-none'));
  document.querySelectorAll('#tcTabs .nav-link').forEach(b => b.classList.remove('active'));
  document.getElementById('tcTab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('d-none');
  if (btn) btn.classList.add('active');

  if (tab === 'attendance') {
    const today = new Date();
    const d = new Date(today.getTime() - today.getTimezoneOffset()*60000).toISOString().split('T')[0];
    const el = document.getElementById('tcAttDate');
    if (!el.value) el.value = d;
    _tcLoadAttSummary(function(s) {
      const sessions = s.sessions || [];
      document.getElementById('tcAttSessionCount').textContent = sessions.length
        ? `${sessions.length} คาบที่เช็คแล้วในเทอมนี้` : 'ยังไม่มีประวัติการเช็คชื่อ';
    });
  }
  if (tab === 'stats') _tcRenderStats();
}

// ==========================================
// Print
// ==========================================
function tcPrintMembers() {
  if (!_tcMembers.length) { alert('ไม่มีสมาชิกให้พิมพ์'); return; }
  const user = JSON.parse(localStorage.getItem('pssms_user') || sessionStorage.getItem('pssms_user'));
  const byClass = {};
  _tcMembers.forEach(m => (byClass[m.className] = byClass[m.className] || []).push(m));
  let body = `<h2 style="text-align:center;">รายชื่อสมาชิกชุมนุม</h2>
    <h3 style="text-align:center;">${_tcEsc(_tcCurrentClub.clubName)}</h3>
    <p style="text-align:center;">ภาคเรียนที่ ${user.currentTerm} ปีการศึกษา ${user.currentYear}</p>
    <p style="text-align:center;">จำนวน ${_tcMembers.length} คน</p>`;
  Object.keys(byClass).sort().forEach(cls => {
    body += `<h4 style="margin-top:18px;border-bottom:2px solid #333;">ห้อง ${_tcEsc(cls)} (${byClass[cls].length} คน)</h4>
      <table style="width:100%;border-collapse:collapse;"><thead><tr style="background:#eee;">
        <th style="border:1px solid #999;padding:6px;">ที่</th>
        <th style="border:1px solid #999;padding:6px;">รหัสประจำตัว</th>
        <th style="border:1px solid #999;padding:6px;">ชื่อ-สกุล</th>
        <th style="border:1px solid #999;padding:6px;">ลายเซ็น</th>
      </tr></thead><tbody>`;
    byClass[cls].forEach((m,i) => {
      body += `<tr>
        <td style="border:1px solid #999;padding:6px;text-align:center;">${i+1}</td>
        <td style="border:1px solid #999;padding:6px;">${_tcEsc(m.studentId)}</td>
        <td style="border:1px solid #999;padding:6px;">${_tcEsc(m.studentName)}</td>
        <td style="border:1px solid #999;padding:6px;">&nbsp;</td>
      </tr>`;
    });
    body += '</tbody></table>';
  });
  const win = window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>รายชื่อ ${_tcEsc(_tcCurrentClub.clubName)}</title>
    <style>body{font-family:"Sarabun","Kanit",sans-serif;padding:20px;}</style></head><body>${body}
    <script>window.onload=()=>window.print();<\/script></body></html>`);
  win.document.close();
}

function _tcEsc(s) {
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

setTimeout(initTeacherClubs, 50);
</script>
