<div class="container-fluid pssms-page pssms-dept-academic">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h4 class="fw-bold mb-1"><i class="fas fa-users me-2" style="color: var(--p-accent);"></i>ชุมนุมที่ดูแล</h4>
      <p class="text-muted small mb-0">เทอม <span id="tcTerm">-</span>/<span id="tcYear">-</span></p>
    </div>
    <button class="btn btn-outline-secondary btn-sm" onclick="initTeacherClubs()"><i class="fas fa-sync me-1"></i>รีเฟรช</button>
  </div>

  <div id="teacherClubsList" class="row g-3">
    <div class="col-12 text-center text-muted p-5"><div class="spinner-border spinner-border-sm me-2"></div>กำลังโหลด...</div>
  </div>
</div>

<!-- Modal: Members read-only -->
<div class="modal fade" id="teacherClubMembersModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-users me-2"></i>สมาชิกชุมนุม: <span id="tcMembersName"></span></h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <strong>จำนวน <span id="tcMembersCount">0</span> คน</strong>
          <button class="btn btn-sm btn-outline-primary" onclick="tcPrintMembers()"><i class="fas fa-print me-1"></i>พิมพ์รายชื่อ</button>
        </div>
        <div id="tcMembersList" style="max-height: 480px; overflow-y: auto;" class="border rounded p-2"></div>
      </div>
    </div>
  </div>
</div>

<script>
let _tcMyClubs = [];
let _tcCurrentMembers = [];
let _tcCurrentClubName = '';

function initTeacherClubs() {
  const user = JSON.parse(localStorage.getItem('pssms_user') || sessionStorage.getItem('pssms_user'));
  if (!user) return;
  document.getElementById('tcTerm').textContent = user.currentTerm;
  document.getElementById('tcYear').textContent = user.currentYear;

  google.script.run.withSuccessHandler(list => {
    _tcMyClubs = list || [];
    renderTeacherClubs(_tcMyClubs);
  }).getMyClubs(user.id, user.currentTerm, user.currentYear);
}

function renderTeacherClubs(list) {
  const wrap = document.getElementById('teacherClubsList');
  if (!list || list.length === 0) {
    wrap.innerHTML = '<div class="col-12 text-center text-muted p-5"><i class="fas fa-inbox fa-3x opacity-25 mb-3 d-block"></i>คุณยังไม่ได้รับมอบหมายให้ดูแลชุมนุมในเทอมนี้</div>';
    return;
  }
  let html = '';
  list.forEach(c => {
    const advText = (c.advisors || []).map(a => a.teacherName).filter(Boolean).join(', ');
    const seatPercent = c.capacity > 0 ? Math.min(100, Math.round((c.memberCount / c.capacity) * 100)) : 0;
    const seatColor = c.full ? 'bg-danger' : (seatPercent > 80 ? 'bg-warning' : 'bg-success');
    html += `<div class="col-md-6 col-lg-4">
      <div class="card shadow-sm h-100 border-primary border-2">
        <div class="card-body p-3 d-flex flex-column">
          <h5 class="fw-bold mb-1">${_tcEsc(c.clubName)}</h5>
          <small class="text-muted mb-2">บทบาท: <span class="badge bg-primary">${_tcEsc(c.myRole || 'หัวหน้า')}</span></small>
          ${c.description ? `<p class="small text-muted mb-2">${_tcEsc(c.description)}</p>` : ''}
          <div class="small text-muted mb-2"><i class="fas fa-chalkboard-teacher me-1"></i>${_tcEsc(advText) || '-'}</div>
          <div class="mb-2">
            <div class="d-flex justify-content-between small mb-1">
              <span class="text-muted">ที่นั่ง</span>
              <span class="${c.full ? 'text-danger fw-bold' : 'text-success'}">${c.memberCount} / ${c.capacity || '∞'}</span>
            </div>
            <div class="progress" style="height: 6px;"><div class="progress-bar ${seatColor}" style="width: ${seatPercent}%;"></div></div>
          </div>
          <div class="mt-auto">
            <button class="btn btn-primary btn-sm w-100" onclick="tcViewMembers('${c.clubId}', '${_tcEsc(c.clubName)}', '${c.term}', '${c.year}')">
              <i class="fas fa-list me-1"></i>ดูรายชื่อสมาชิก
            </button>
          </div>
        </div>
      </div>
    </div>`;
  });
  wrap.innerHTML = html;
}

function _tcEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function tcViewMembers(clubId, clubName, term, year) {
  const user = JSON.parse(localStorage.getItem('pssms_user') || sessionStorage.getItem('pssms_user'));
  document.getElementById('tcMembersName').textContent = clubName;
  _tcCurrentClubName = clubName;
  document.getElementById('tcMembersList').innerHTML = '<div class="text-muted text-center p-3"><div class="spinner-border spinner-border-sm me-2"></div>กำลังโหลด...</div>';
  new bootstrap.Modal(document.getElementById('teacherClubMembersModal')).show();

  google.script.run.withSuccessHandler(res => {
    if (res && res.error) {
      document.getElementById('tcMembersList').innerHTML = `<div class="text-danger text-center p-3">❌ ${res.error}</div>`;
      return;
    }
    const members = Array.isArray(res) ? res : [];
    _tcCurrentMembers = members;
    document.getElementById('tcMembersCount').textContent = members.length;
    if (!members.length) {
      document.getElementById('tcMembersList').innerHTML = '<div class="text-muted text-center p-3"><i class="fas fa-inbox fa-2x opacity-25 mb-2 d-block"></i>ยังไม่มีสมาชิก</div>';
      return;
    }
    const byClass = {};
    members.forEach(m => { (byClass[m.className] = byClass[m.className] || []).push(m); });
    let html = '';
    Object.keys(byClass).sort().forEach(cls => {
      html += `<div class="border-bottom mb-2 pb-1"><strong class="small text-primary">ห้อง ${_tcEsc(cls)} <span class="text-muted">(${byClass[cls].length} คน)</span></strong></div>`;
      byClass[cls].forEach((m, i) => {
        html += `<div class="d-flex justify-content-between align-items-center small py-1 border-bottom border-light">
          <div><span class="text-muted me-2" style="font-family: monospace;">${i + 1}.</span> <span class="text-muted me-2">${_tcEsc(m.studentId)}</span> ${_tcEsc(m.studentName)}</div>
        </div>`;
      });
    });
    document.getElementById('tcMembersList').innerHTML = html;
  }).getClubMembersForTeacher(user.id, clubId, user.currentTerm, user.currentYear, user.role);
}

function tcPrintMembers() {
  if (!_tcCurrentMembers || _tcCurrentMembers.length === 0) { alert('ไม่มีสมาชิกให้พิมพ์'); return; }
  const user = JSON.parse(localStorage.getItem('pssms_user') || sessionStorage.getItem('pssms_user'));
  const byClass = {};
  _tcCurrentMembers.forEach(m => { (byClass[m.className] = byClass[m.className] || []).push(m); });
  let body = `<h2 style="text-align:center;">รายชื่อสมาชิกชุมนุม</h2>
    <h3 style="text-align:center;">${_tcEsc(_tcCurrentClubName)}</h3>
    <p style="text-align:center;">ภาคเรียนที่ ${user.currentTerm} ปีการศึกษา ${user.currentYear}</p>
    <p style="text-align:center;">จำนวน ${_tcCurrentMembers.length} คน</p>`;
  Object.keys(byClass).sort().forEach(cls => {
    body += `<h4 style="margin-top:18px; border-bottom: 2px solid #333;">ห้อง ${_tcEsc(cls)} (${byClass[cls].length} คน)</h4>
      <table style="width:100%; border-collapse: collapse;"><thead><tr style="background:#eee;">
        <th style="border:1px solid #999; padding:6px;">ที่</th>
        <th style="border:1px solid #999; padding:6px;">รหัสประจำตัว</th>
        <th style="border:1px solid #999; padding:6px;">ชื่อ-สกุล</th>
        <th style="border:1px solid #999; padding:6px;">ลายเซ็น</th>
      </tr></thead><tbody>`;
    byClass[cls].forEach((m, i) => {
      body += `<tr>
        <td style="border:1px solid #999; padding:6px; text-align:center;">${i+1}</td>
        <td style="border:1px solid #999; padding:6px;">${_tcEsc(m.studentId)}</td>
        <td style="border:1px solid #999; padding:6px;">${_tcEsc(m.studentName)}</td>
        <td style="border:1px solid #999; padding:6px;">&nbsp;</td>
      </tr>`;
    });
    body += '</tbody></table>';
  });
  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>รายชื่อ ${_tcEsc(_tcCurrentClubName)}</title>
    <style>body{font-family:"Sarabun","Kanit",sans-serif;padding:20px;}</style></head><body>${body}
    <script>window.onload=()=>window.print();<\/script></body></html>`);
  win.document.close();
}

setTimeout(initTeacherClubs, 50);
</script>
