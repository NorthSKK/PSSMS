<div class="container-fluid pssms-page" id="execDashPage">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h4 class="fw-bold mb-1"><i class="fas fa-chart-line me-2 text-primary"></i>แดชบอร์ดผู้บริหาร</h4>
      <p class="text-muted small mb-0" id="execDeptLabel">กำลังโหลด...</p>
    </div>
    <button class="btn btn-outline-secondary btn-sm" onclick="initExecDashboard()">
      <i class="fas fa-sync me-1"></i>รีเฟรช
    </button>
  </div>

  <!-- Loading -->
  <div id="execLoading" class="text-center py-5 text-muted">
    <div class="spinner-border text-primary mb-3" role="status"></div>
    <div>กำลังรวบรวมข้อมูล...</div>
  </div>

  <!-- Content -->
  <div id="execContent" class="d-none">

    <!-- KPI Strip -->
    <div class="row g-3 mb-4" id="execKPIRow">
      <div class="col-6 col-md-3">
        <div class="pssms-card p-3 text-center h-100">
          <div class="fw-bold" style="font-size:2rem;color:var(--p-accent);" id="kpiStudents">-</div>
          <div class="text-muted small">นักเรียนทั้งหมด</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="pssms-card p-3 text-center h-100">
          <div class="fw-bold" style="font-size:2rem;color:#198754;" id="kpiTeachers">-</div>
          <div class="text-muted small">ครู/บุคลากร</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="pssms-card p-3 text-center h-100">
          <div class="fw-bold" style="font-size:2rem;" id="kpiAttPct">-</div>
          <div class="text-muted small">เข้าเรียนวันนี้</div>
          <div class="small text-muted" id="kpiAttDetail"></div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="pssms-card p-3 text-center h-100">
          <div class="fw-bold" style="font-size:2rem;" id="kpiBudgetPct">-</div>
          <div class="text-muted small">งบประมาณที่ใช้ไป</div>
          <div class="progress mt-1" style="height:4px;"><div class="progress-bar" id="kpiBudgetBar" style="width:0%"></div></div>
        </div>
      </div>
    </div>

    <!-- Alerts -->
    <div id="execAlerts" class="mb-4"></div>

    <!-- Main sections — layout depends on dept -->
    <div class="row g-3" id="execSections">
    </div>

    <!-- Calendar Strip -->
    <div class="pssms-card mt-4 mb-2" id="execCalendarCard">
      <div class="pssms-card-header px-3 py-2 d-flex justify-content-between align-items-center">
        <span class="fw-bold small"><i class="fas fa-calendar-alt me-2" style="color:var(--p-accent)"></i>กิจกรรม 14 วันข้างหน้า</span>
      </div>
      <div id="execCalendarBody" class="p-3">
        <div class="text-muted small text-center py-3">กำลังโหลด...</div>
      </div>
    </div>

  </div>
</div>

<script>
function initExecDashboard() {
  const user = JSON.parse(localStorage.getItem('pssms_user') || sessionStorage.getItem('pssms_user'));
  if (!user) return;

  const dept = (user.dept || 'ผอ.').trim();
  document.getElementById('execDeptLabel').textContent =
    dept === 'ผอ.' ? 'ภาพรวมทั้งโรงเรียน' :
    dept === 'วิชาการ' ? 'รองผู้อำนวยการฝ่ายวิชาการ' :
    dept === 'งบประมาณ' ? 'รองผู้อำนวยการฝ่ายงบประมาณ' :
    dept === 'บุคคล' ? 'รองผู้อำนวยการฝ่ายบุคคล' :
    dept === 'ทั่วไป' ? 'รองผู้อำนวยการฝ่ายทั่วไป' : dept;

  document.getElementById('execLoading').classList.remove('d-none');
  document.getElementById('execContent').classList.add('d-none');

  google.script.run
    .withSuccessHandler(function(bundle) {
      if (!document.getElementById('execDashPage')) return;
      document.getElementById('execLoading').classList.add('d-none');
      document.getElementById('execContent').classList.remove('d-none');
      _execRender(bundle, dept);
    })
    .withFailureHandler(function(err) {
      document.getElementById('execLoading').innerHTML =
        `<i class="fas fa-exclamation-triangle text-danger fa-2x mb-2 d-block"></i><div class="text-danger">โหลดข้อมูลไม่สำเร็จ: ${err.message||''}</div>`;
    })
    .getExecutiveDashboardBundle(dept);
}

function _execRender(bundle, dept) {
  _renderKPI(bundle.kpi);
  _renderAlerts(bundle, dept);
  _renderSections(bundle, dept);
  _renderCalendar(bundle.calendar);
}

// ==========================================
// KPI
// ==========================================
function _renderKPI(section) {
  if (!section || !section.ok) return;
  const d = section.data;

  document.getElementById('kpiStudents').textContent = d.studentCount.toLocaleString();
  document.getElementById('kpiTeachers').textContent = d.teacherCount;

  if (d.attPct !== null) {
    const attEl = document.getElementById('kpiAttPct');
    attEl.textContent = d.attPct + '%';
    attEl.style.color = d.attPct >= 90 ? '#198754' : d.attPct >= 75 ? '#ffc107' : '#dc3545';
    document.getElementById('kpiAttDetail').textContent = `${d.todayPresent}/${d.todayTotal} คน`;
  } else {
    document.getElementById('kpiAttPct').textContent = 'ยังไม่มี';
    document.getElementById('kpiAttPct').style.color = '#6c757d';
  }

  const bpEl = document.getElementById('kpiBudgetPct');
  bpEl.textContent = d.budgetUsedPct + '%';
  bpEl.style.color = d.budgetUsedPct >= 90 ? '#dc3545' : d.budgetUsedPct >= 75 ? '#ffc107' : '#198754';
  const bar = document.getElementById('kpiBudgetBar');
  bar.style.width = d.budgetUsedPct + '%';
  bar.className = 'progress-bar ' + (d.budgetUsedPct >= 90 ? 'bg-danger' : d.budgetUsedPct >= 75 ? 'bg-warning' : 'bg-success');
}

// ==========================================
// Alerts
// ==========================================
function _renderAlerts(bundle, dept) {
  const alerts = [];

  if (bundle.academic && bundle.academic.ok) {
    const a = bundle.academic.data;
    if (a.noAttendanceTeachers && a.noAttendanceTeachers.length > 0)
      alerts.push({ color: 'warning', icon: 'fa-exclamation-circle', msg: `ครู ${a.noAttendanceTeachers.length} คนไม่ได้บันทึกการสอน 3 วัน` });
    if (a.riskCount > 0)
      alerts.push({ color: 'danger', icon: 'fa-user-times', msg: `นักเรียนกลุ่มเสี่ยง ${a.riskCount} คน` });
  }
  if (bundle.kpi && bundle.kpi.ok && bundle.kpi.data.budgetUsedPct >= 90)
    alerts.push({ color: 'danger', icon: 'fa-wallet', msg: `งบประมาณเหลือ ${100 - bundle.kpi.data.budgetUsedPct}% — ใกล้หมด` });
  if (bundle.general && bundle.general.ok && bundle.general.data.pendingFile > 0)
    alerts.push({ color: 'secondary', icon: 'fa-file-upload', msg: `หนังสือ ${bundle.general.data.pendingFile} เลขที่ยังไม่แนบไฟล์` });

  const box = document.getElementById('execAlerts');
  if (!alerts.length) { box.innerHTML = ''; return; }
  box.innerHTML = alerts.map(a =>
    `<div class="alert alert-${a.color} alert-dismissible py-2 mb-2 small">
      <i class="fas ${a.icon} me-2"></i>${a.msg}
      <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
    </div>`
  ).join('');
}

// ==========================================
// Sections
// ==========================================
function _renderSections(bundle, dept) {
  const wrap = document.getElementById('execSections');
  let html = '';

  const show = {
    academic:  dept === 'ผอ.' || dept === 'วิชาการ',
    budget:    dept === 'ผอ.' || dept === 'งบประมาณ',
    personnel: dept === 'ผอ.' || dept === 'บุคคล',
    general:   dept === 'ผอ.' || dept === 'ทั่วไป'
  };
  const colClass = dept === 'ผอ.' ? 'col-md-6' : 'col-12';

  if (show.academic) html += _sectionAcademic(bundle.academic, colClass);
  if (show.budget)   html += _sectionBudget(bundle.budget, colClass);
  if (show.personnel) html += _sectionPersonnel(bundle.personnel, colClass);
  if (show.general)  html += _sectionGeneral(bundle.general, colClass);

  wrap.innerHTML = html;
}

function _sectionAcademic(section, colClass) {
  if (!section || !section.ok) return `<div class="${colClass}"><div class="pssms-card pssms-dept-academic p-3 text-muted small">ฝ่ายวิชาการ: โหลดไม่สำเร็จ</div></div>`;
  const d = section.data;

  // Trend sparkline (last 7 days)
  const last7 = (d.trend || []).slice(-7);
  const bars = last7.map(function(day) {
    const total = day.present + day.absent + day.leave;
    const pct = total > 0 ? Math.round(day.present / total * 100) : 0;
    const color = pct >= 90 ? '#198754' : pct >= 75 ? '#ffc107' : total > 0 ? '#dc3545' : '#dee2e6';
    const label = day.date ? day.date.slice(5) : '';
    return `<div class="d-flex flex-column align-items-center" style="flex:1;">
      <div style="height:${Math.max(4, pct * 0.5)}px;background:${color};width:70%;border-radius:3px 3px 0 0;transition:.3s;" title="${label} ${pct}%"></div>
      <div class="text-muted" style="font-size:9px;margin-top:2px;">${label}</div>
    </div>`;
  }).join('');

  return `<div class="${colClass}">
    <div class="pssms-card h-100">
      <div class="pssms-card-header px-3 py-2 d-flex justify-content-between">
        <span class="fw-bold small"><i class="fas fa-graduation-cap me-2" style="color:var(--p-accent)"></i>ฝ่ายวิชาการ</span>
        <a href="javascript:void(0)" onclick="loadPage('Page_Academic_Report')" class="small text-primary">ดูรายงาน →</a>
      </div>
      <div class="p-3">
        <div class="mb-2 small fw-bold text-muted">แนวโน้มการเข้าเรียน 7 วัน</div>
        <div class="d-flex align-items-end gap-1 mb-3" style="height:60px;">${bars}</div>
        <div class="row g-2 text-center">
          <div class="col-6">
            <div class="pssms-card p-2">
              <div class="fw-bold text-danger fs-5">${d.riskCount || 0}</div>
              <div class="text-muted small">กลุ่มเสี่ยง</div>
            </div>
          </div>
          <div class="col-6">
            <div class="pssms-card p-2">
              <div class="fw-bold text-warning fs-5">${(d.noAttendanceTeachers||[]).length}</div>
              <div class="text-muted small">ครูไม่บันทึก</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function _sectionBudget(section, colClass) {
  if (!section || !section.ok) return `<div class="${colClass}"><div class="pssms-card pssms-dept-budget p-3 text-muted small">ฝ่ายงบประมาณ: โหลดไม่สำเร็จ</div></div>`;
  const d = section.data;
  const projects = (d.projects || []).slice(0, 5);
  const totalPct = d.total > 0 ? Math.round(d.used / d.total * 100) : 0;

  const rows = projects.length ? projects.map(function(p) {
    const barColor = p.pct >= 90 ? 'bg-danger' : p.pct >= 75 ? 'bg-warning' : 'bg-success';
    return `<div class="mb-2">
      <div class="d-flex justify-content-between small mb-1">
        <span class="text-truncate" style="max-width:200px;" title="${p.name}">${p.name}</span>
        <span class="fw-bold ${p.pct>=90?'text-danger':p.pct>=75?'text-warning':''}">${p.pct}%</span>
      </div>
      <div class="progress" style="height:6px;"><div class="progress-bar ${barColor}" style="width:${p.pct}%"></div></div>
    </div>`;
  }).join('') : '<div class="text-muted small text-center py-2">ไม่มีข้อมูลงบประมาณ</div>';

  return `<div class="${colClass}">
    <div class="pssms-card h-100">
      <div class="pssms-card-header px-3 py-2 d-flex justify-content-between">
        <span class="fw-bold small"><i class="fas fa-wallet me-2" style="color:#198754"></i>ฝ่ายงบประมาณ</span>
        <a href="javascript:void(0)" onclick="loadPage('Page_Budget')" class="small text-primary">ดูทั้งหมด →</a>
      </div>
      <div class="p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="small text-muted">รวมทั้งหมด</span>
          <span class="fw-bold ${totalPct>=90?'text-danger':''}">${totalPct}% (${_fmtBaht(d.used)} / ${_fmtBaht(d.total)})</span>
        </div>
        <div class="progress mb-3" style="height:8px;">
          <div class="progress-bar ${totalPct>=90?'bg-danger':totalPct>=75?'bg-warning':'bg-success'}" style="width:${totalPct}%"></div>
        </div>
        <div class="small fw-bold text-muted mb-2">โครงการใช้งบสูงสุด</div>
        ${rows}
      </div>
    </div>
  </div>`;
}

function _sectionPersonnel(section, colClass) {
  if (!section || !section.ok) return `<div class="${colClass}"><div class="pssms-card pssms-dept-personnel p-3 text-muted small">ฝ่ายบุคคล: โหลดไม่สำเร็จ</div></div>`;
  const d = section.data;
  const leaveTypes = Object.entries(d.leaveByType || {}).sort((a,b) => b[1]-a[1]);

  const leaveRows = d.thisMonthLeave && d.thisMonthLeave.length
    ? d.thisMonthLeave.slice(0,5).map(l =>
        `<div class="d-flex justify-content-between small py-1 border-bottom">
          <span>${l.name}</span>
          <span class="badge bg-secondary">${l.type}</span>
        </div>`).join('')
    : '<div class="text-muted small text-center py-2">ไม่มีการลาเดือนนี้</div>';

  const typeBadges = leaveTypes.slice(0,4).map(([t,n]) =>
    `<span class="badge bg-light text-dark border me-1">${t}: ${n}</span>`).join('');

  return `<div class="${colClass}">
    <div class="pssms-card h-100">
      <div class="pssms-card-header px-3 py-2 d-flex justify-content-between">
        <span class="fw-bold small"><i class="fas fa-users me-2" style="color:#0d6efd"></i>ฝ่ายบุคคล</span>
        <a href="javascript:void(0)" onclick="loadPage('Page_Personnel')" class="small text-primary">ดูทั้งหมด →</a>
      </div>
      <div class="p-3">
        <div class="d-flex gap-3 mb-3 text-center">
          <div class="flex-fill pssms-card p-2">
            <div class="fw-bold fs-5 text-primary">${d.staffCount||0}</div>
            <div class="text-muted small">ครู/บุคลากร</div>
          </div>
          <div class="flex-fill pssms-card p-2">
            <div class="fw-bold fs-5 text-warning">${(d.thisMonthLeave||[]).length}</div>
            <div class="text-muted small">ลาเดือนนี้</div>
          </div>
        </div>
        ${typeBadges ? `<div class="mb-2">${typeBadges}</div>` : ''}
        <div class="small fw-bold text-muted mb-1">รายชื่อการลาเดือนนี้</div>
        ${leaveRows}
      </div>
    </div>
  </div>`;
}

function _sectionGeneral(section, colClass) {
  if (!section || !section.ok) return `<div class="${colClass}"><div class="pssms-card pssms-dept-general p-3 text-muted small">ฝ่ายทั่วไป: โหลดไม่สำเร็จ</div></div>`;
  const d = section.data;

  const docRows = (d.recent||[]).length
    ? (d.recent||[]).map(r =>
        `<div class="d-flex gap-2 align-items-start small py-1 border-bottom">
          <span class="badge bg-primary flex-shrink-0">${r.docType}</span>
          <div class="flex-grow-1 text-truncate" title="${r.subject}">${r.subject}</div>
          <span class="text-muted flex-shrink-0">${r.docNumber}</span>
        </div>`).join('')
    : '<div class="text-muted small text-center py-2">ไม่มีข้อมูลสารบรรณ</div>';

  return `<div class="${colClass}">
    <div class="pssms-card h-100">
      <div class="pssms-card-header px-3 py-2 d-flex justify-content-between">
        <span class="fw-bold small"><i class="fas fa-file-alt me-2" style="color:#fd7e14"></i>ฝ่ายทั่วไป — สารบรรณ</span>
        <a href="javascript:void(0)" onclick="loadPage('Page_General')" class="small text-primary">ดูทั้งหมด →</a>
      </div>
      <div class="p-3">
        <div class="d-flex gap-3 mb-3 text-center">
          <div class="flex-fill pssms-card p-2">
            <div class="fw-bold fs-5 text-primary">${(d.recent||[]).length}</div>
            <div class="text-muted small">ล่าสุด</div>
          </div>
          <div class="flex-fill pssms-card p-2">
            <div class="fw-bold fs-5 ${d.pendingFile>0?'text-warning':'text-success'}">${d.pendingFile||0}</div>
            <div class="text-muted small">ยังไม่แนบไฟล์</div>
          </div>
        </div>
        <div class="small fw-bold text-muted mb-1">เอกสารล่าสุด</div>
        ${docRows}
      </div>
    </div>
  </div>`;
}

// ==========================================
// Calendar Strip
// ==========================================
function _renderCalendar(section) {
  const body = document.getElementById('execCalendarBody');
  if (!section || !section.ok || !section.data || !section.data.length) {
    body.innerHTML = '<div class="text-muted small text-center py-2">ไม่มีกิจกรรมในช่วงนี้</div>';
    return;
  }
  const today = new Date();
  const todayStr = new Date(today.getTime() - today.getTimezoneOffset()*60000).toISOString().split('T')[0];
  const cutoff = new Date(today.getTime() + 14*86400000);
  const cutoffStr = new Date(cutoff.getTime() - cutoff.getTimezoneOffset()*60000).toISOString().split('T')[0];

  const events = (section.data || []).filter(function(e) {
    return e.startDate >= todayStr && e.startDate <= cutoffStr;
  }).sort(function(a,b) { return a.startDate.localeCompare(b.startDate); }).slice(0, 10);

  if (!events.length) { body.innerHTML = '<div class="text-muted small text-center py-2">ไม่มีกิจกรรม 14 วันข้างหน้า</div>'; return; }

  body.innerHTML = '<div class="d-flex flex-wrap gap-2">' + events.map(function(e) {
    const parts = e.startDate.split('-');
    const dateLabel = parseInt(parts[2]) + '/' + parseInt(parts[1]);
    return `<div class="pssms-card px-3 py-2 d-flex align-items-center gap-2" style="min-width:0;">
      <div class="text-center flex-shrink-0" style="width:36px;">
        <div class="fw-bold" style="font-size:16px;line-height:1;color:var(--p-accent);">${parseInt(parts[2])}</div>
        <div class="text-muted" style="font-size:10px;">${['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][parseInt(parts[1])]}</div>
      </div>
      <div class="text-truncate small fw-medium" style="max-width:160px;" title="${e.title||''}">${e.title||''}</div>
    </div>`;
  }).join('') + '</div>';
}

// ==========================================
// Util
// ==========================================
function _fmtBaht(n) {
  if (!n) return '0';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(0) + 'K';
  return Number(n).toLocaleString();
}

setTimeout(initExecDashboard, 50);
</script>
